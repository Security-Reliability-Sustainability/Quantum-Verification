[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qsys-audit"
version = "1.0.0"
description = "Offline cross-layer verification of concurrent crosstalk in shared quantum processors"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Syed Emad Uddin Shubha" },
    { name = "Tasnuva Farheen" },
]
keywords = [
    "quantum computing",
    "crosstalk",
    "quantum process tomography",
    "classical shadows",
    "multi-tenancy",
    "hardware security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "qutip>=5.0",
    "qiskit>=1.0",
    "mqt.bench>=1.1",
]

[project.optional-dependencies]
qip = ["qutip-qip>=0.4"]
dev = ["pytest>=7.0", "build>=1.0"]

[project.scripts]
qsys-audit = "qsys_audit.cli:main"
qsys-audit-experiments = "qsys_audit.experiments_runner:main"

[project.urls]
Repository = "https://github.com/syedshubha/QVSh"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qsys_audit = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
